<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // HashRouter routes live at /#/path. Preserve a requested route instead of
      // dropping visitors on the homepage; skip asset-like paths.
      (function () {
        var path = window.location.pathname;
        var target = /\.[a-zA-Z0-9]+$/.test(path) ? '/' : '/#' + path;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p><a href="/">Go to the portfolio</a></p>
  </body>
</html>
